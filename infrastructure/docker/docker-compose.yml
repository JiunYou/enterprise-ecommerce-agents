version: '3.8'

services:
  frontend-web:
    image: node:20-alpine
    container_name: prawn-frontend-web
    working_dir: /app
    volumes:
      - ../../apps/web:/app
      - frontend-web-node-modules:/app/node_modules
      - frontend-web-next-cache:/app/.next
    command: sh -c "npm ci && npm run dev"
    ports:
      - "3000:3000"
    networks:
      - app-network

  frontend-admin:
    image: node:20-alpine
    container_name: prawn-frontend-admin
    working_dir: /app
    volumes:
      - ../../apps/admin:/app
      - frontend-admin-node-modules:/app/node_modules
      - frontend-admin-next-cache:/app/.next
    command: sh -c "npm ci && npm run dev"
    ports:
      - "3001:3000"
    networks:
      - app-network

  db-migrate:
    image: mcr.microsoft.com/dotnet/sdk:8.0
    container_name: prawn-db-migrate
    working_dir: /src
    volumes:
      - ../../services/backend:/src
    environment:
      - ConnectionStrings__Database=Server=mysql;Port=3306;Database=${MYSQL_DATABASE};User=${MYSQL_USER};Password=${MYSQL_PASSWORD};
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app-network
    command: >
      sh -c "dotnet tool restore && dotnet tool run dotnet-ef database update --project EnterpriseCommerce.Infrastructure/EnterpriseCommerce.Infrastructure.csproj --startup-project EnterpriseCommerce.WebApi/EnterpriseCommerce.WebApi.csproj"

  backend-api:
    image: mcr.microsoft.com/dotnet/sdk:8.0
    container_name: prawn-backend-api
    working_dir: /src
    volumes:
      - ../../services/backend:/src
    command: dotnet watch --no-launch-profile run --project EnterpriseCommerce.WebApi/EnterpriseCommerce.WebApi.csproj
    ports:
      - "${BACKEND_HTTP_PORT:-5110}:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://0.0.0.0:8080
      - ConnectionStrings__Database=Server=mysql;Port=3306;Database=${MYSQL_DATABASE};User=${MYSQL_USER};Password=${MYSQL_PASSWORD};
    depends_on:
      mysql:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    networks:
      - app-network

  mysql:
    image: mysql:8.0
    container_name: prawn-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: prawn-redis
    profiles:
      - cache
    ports:
      - "6379:6379"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: prawn-rabbitmq
    profiles:
      - rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  elasticsearch:
    image: elasticsearch:8.10.2
    container_name: prawn-elasticsearch
    profiles:
      - search
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

networks:
  app-network:
    driver: bridge

volumes:
  frontend-web-node-modules:
  frontend-web-next-cache:
  frontend-admin-node-modules:
  frontend-admin-next-cache:
